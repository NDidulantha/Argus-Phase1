services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Bootstrap superuser: used ONLY by the init script below.
      # The application connects as the non-superuser 'argus' role,
      # created in db/init/ — otherwise RLS would be silently bypassed.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres     # dev-only credential
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ARGUS_ENV: dev
      ARGUS_DATABASE_URL: postgresql+asyncpg://argus:argus@db:5432/argus
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
